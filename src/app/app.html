<header class="pt-4 pb-4" style="background-color: blue;">
  <div class="container text-center">
    <div class="row">
      <div class="col">
        <a (click)="goRoute()" style="cursor: pointer;">
          <img src="/logo.jpg" alt="logo" class="logo">
        </a>
      </div>
      <div class="col align-self-center">
        <h5 class="banner">Despacho Jurídico Lic. Edgar Sanchez</h5>
      </div>
      <div class="col align-self-center">
        <div class="container">
          <div class="row">
            <div class="col align-self-center text-end">
              <label for="" style="color: white;">{{authService.nombre()}}</label>
            </div>
            <div class="col text-start">
              <a (click)="authService.logout()" class="sesion" >
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </a>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</header>
<div class = "container mt-5 mb-5 pb-5">
  <main class="main">
    <router-outlet />
  </main>
</div>
