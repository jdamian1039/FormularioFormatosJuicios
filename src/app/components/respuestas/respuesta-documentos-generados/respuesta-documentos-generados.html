<div class="container text-center mt-5">
  <h2>¡Documento Procesado con Éxito! 🎉</h2>
  <p class="text-muted">El archivo ha sido generado y guardado de forma segura.</p>

  <hr>

  <div class="my-4">
    <a [href]="oneDriveUrl()" target="_blank" class="btn btn-outline-success btn-lg me-3 mb-2">
      📁 Abrir en OneDrive
    </a>
    @if(this.fileContentsBase64() !== null) {
      <button (click)="descargarArchivoDesdeNavegador()" class="btn btn-primary btn-lg mb-2">
        ⬇️ Descargar en este Equipo
      </button>
      
    }
  </div>
</div>
